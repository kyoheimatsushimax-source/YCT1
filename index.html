*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}

h1{font-size:26px;margin:6px 0 2px;text-align:center;color:var(--red)}
h2{font-size:20px;margin:4px 0 12px}
.sub{text-align:center;color:var(--mute);font-size:13px;margin-bottom:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}

.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn small{display:block;font-weight:400;font-size:13px;color:var(--mute);margin-top:3px}
.btn.main{background:var(--red);color:#fff;border-color:var(--red2);box-shadow:0 3px 0 var(--red2)}
.btn.main small{color:#ffe3dc}

.back{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:16px;font-weight:700}
.top .ttl{flex:1;font-weight:700;font-size:17px}

.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--green)}
.q{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 14px;text-align:center}

.jp{font-size:15px;margin-top:6px}
.pic{font-size:84px;line-height:1.15;margin:8px 0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui}
.pic.m{font-size:54px}.pic.s{font-size:38px}
.spk{background:var(--gold);border-radius:50%;width:92px;height:92px;font-size:44px;margin:6px auto;display:block;box-shadow:0 4px 0 #d69a16}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #d69a16}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tf button,.opt{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 6px;font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tf button b{display:block;font-size:44px;line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.grid1{display:grid;gap:10px;margin-top:14px}
.opt .pic{font-size:46px;margin:0}.opt .pic.m{font-size:30px}.opt .pic.s{font-size:22px}
.opt.txt{text-align:left;padding:12px 14px}
.opt.txt .py{font-size:19px}.opt.txt .hz{font-size:17px}
.ok{border-color:var(--green)!important;background:#e4f6ec!important}
.ng{border-color:var(--red)!important;background:#fde7e2!important}
.fb{margin-top:14px;border-radius:18px;padding:14px;text-align:center;background:#fff;border:2px dashed var(--line)}
.fb .res{font-size:24px;font-weight:800}
.fb .py{font-size:19px}.fb .hz{font-size:18px}

.card .hz{font-size:54px;color:var(--ink);font-weight:700}
.card .py{font-size:28px;color:var(--red)}
.row{display:flex;gap:10px;margin-top:12px}

.row button.on{background:#e4f6ec;border-color:var(--green)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats .btn{margin:0;font-size:16px;padding:13px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{background:#fbeed8}
.box{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;font-size:14px;line-height:1.7}
.box h3{margin:0 0 6px;font-size:16px}
input[type=date],select{font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px;background:#fff}
.big{font-size:54px;font-weight:800;color:var(--red);text-align:center}
.warn{background:#fff3cd;border:2px solid #f0d27a;border-radius:14px;padding:10px;font-size:13px;margin:10px 0}
.center{text-align:center}
</style>

/* ===== 出題ロジック ===== */
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const take=(a,n)=>shuf(a).slice(0,n);
const PW=W.filter(w=>w[5]);
function gen(part,n){
  const out=[];
  if(part==='L1'||part==='R1'){
    for(const w of take(PW,n)){
      const truth=Math.random()<.5;
      let o=w; if(!truth){ const pool=PW.filter(x=>x[4]===w[4]&&x!==w); o=pool.length&&Math.random()<.6?pool[rnd(pool.length)]:take(PW.filter(x=>x!==w),1)[0]; }
      out.push({part,type:'tf',audio:part==='L1'?[w[0]]:null,text:part==='R1'?{py:w[1],hz:w[0]}:null,pic:o[3],answer:truth,
        ex:{py:w[1],hz:w[0],jp:w[2]+'　'+w[3]},word:w[0]});
    }
  }else if(part==='L2'){
    for(const p of take(PH,n)){
      const opts=shuf([p[3],p[4],p[5]]);
      out.push({part,type:'pick',audio:[p[0]],opts:opts.map(x=>({pic:x})),answer:opts.indexOf(p[3]),ex:{py:p[1],hz:p[0],jp:p[2]}});
    }
  }else if(part==='L3'){
    for(const s of take(S,n)){
      const truth=Math.random()<.5;
      out.push({part,type:'tf',audio:[s[0]],pic:truth?s[3]:s[4],answer:truth,ex:{py:s[1],hz:s[0],jp:s[2]+'　'+s[3]}});
    }
  }else if(part==='L4'){
    for(const d of take(D,n)){
      const opts=shuf([d[5],d[6],d[7]]);
      out.push({part,type:'pick',audio:[d[0],d[2]],opts:opts.map(x=>({pic:x})),answer:opts.indexOf(d[5]),
        ex:{py:'A: '+d[1]+'<br>B: '+d[3],hz:'A: '+d[0]+'　B: '+d[2],jp:d[4]}});
    }
  }else if(part==='R2'){
    for(const s of take(S,n)){
      const others=[],seenG=new Set([s[5]]);
      for(const x of shuf(S)){ if(others.length>=5)break; if(seenG.has(x[5]))continue; seenG.add(x[5]); others.push(x[3]); }
      const opts=shuf([s[3],...others]);
      out.push({part,type:'pick',text:{py:s[1],hz:s[0]},opts:opts.map(x=>({pic:x})),answer:opts.indexOf(s[3]),ex:{py:s[1],hz:s[0],jp:s[2]}});
    }
  }else if(part==='R3'){
    for(const q of take(QA,n)){
      const others=take(QA.filter(x=>x!==q&&x[2]!==q[2]),5);
      const opts=shuf([q,...others]);
      out.push({part,type:'pick',text:{py:q[1],hz:q[0]},opts:opts.map(x=>({py:x[3],hz:x[2]})),answer:opts.indexOf(q),
        ex:{py:'A: '+q[1]+'<br>B: '+q[3],hz:'A: '+q[0]+'　B: '+q[2],jp:q[4]}});
    }
  }
  return out;
}
const genMock=()=>PARTS.flatMap(p=>gen(p.id,5));
function score(qs,res){
  let l=0,r=0;qs.forEach((q,i)=>{if(res[i]){q.part[0]==='L'?l++:r++}});
  return {l:l*5,r:Math.round(r*100/15),lc:l,rc:r};
}

/* --- 音声（端末の中国語読み上げ） --- */
let voice=null,tok=0;
function loadVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));
  voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/Hans/i.test(v.lang))||vs[0]||null;
}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
function speak(parts,times){
  if(!('speechSynthesis' in window))return;
  const my=++tok;speechSynthesis.cancel();
  const seq=[];for(let t=0;t<(times||1);t++)parts.forEach((p,i)=>seq.push([p.replace(/[（）]/g,'，'),i]));
  let k=0;
  const next=()=>{
    if(my!==tok||k>=seq.length)return;
    const [txt,i]=seq[k++];const u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN';if(voice)u.voice=voice;u.rate=st.rate;u.pitch=i%2?1.35:1;
    u.onend=()=>setTimeout(next,k%parts.length===0?900:350);u.onerror=()=>setTimeout(next,200);
    speechSynthesis.speak(u);
  };
  next();
}
const stop=()=>{tok++;if('speechSynthesis' in window)speechSynthesis.cancel()};

function runQuiz(qs,mock,pid){
  let i=0;const res=[];
  const show=()=>{
    const q=qs[i],pt=PARTS.find(p=>p.id===q.part);
    let h=top(`${mock?'📝 もぎテスト':pt.t}　${i+1}/${qs.length}`)+`<div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="q">`;
    if(mock)h+=`<div class="jp" style="color:var(--mute);margin:0 0 6px">${pt.t}</div>`;
    if(q.audio)h+=`<button class="spk" id="sp">🔊</button><div class="jp" style="color:var(--mute)">2かい ながれるよ。よく きいてね</div>`;
    if(q.text)h+=`<div class="py">${esc(q.text.py)}</div><div class="hz">${esc(q.text.hz)}</div>`;
    if(q.type==='tf')h+=picH(q.pic);
    h+='</div>';
    if(q.type==='tf')h+=`<div class="tf"><button data-a="1"><b>⭕</b>あってる</button><button data-a="0"><b>❌</b>ちがう</button></div>`;
    else if(q.opts[0].pic!==undefined)h+=`<div class="grid3">${q.opts.map((o,k)=>`<button class="opt" data-a="${k}">${picH(o.pic)}</button>`).join('')}</div>`;
    else h+=`<div class="grid1">${q.opts.map((o,k)=>`<button class="opt txt" data-a="${k}"><div class="py">${esc(o.py)}</div><div class="hz">${esc(o.hz)}</div></button>`).join('')}</div>`;
    h+='<div id="fb"></div>';
    $.innerHTML=h;
    onBack(()=>{if(confirm('とちゅうで やめますか？'))mock?home():practiceMenu()});
    if(q.audio){document.getElementById('sp').onclick=()=>speak(q.audio,2);speak(q.audio,2);}
    const btns=[...$.querySelectorAll('[data-a]')];
    btns.forEach(b=>b.onclick=()=>{
      const a=q.type==='tf'?b.dataset.a==='1':+b.dataset.a;
      const ok=a===q.answer;res[i]=ok;
      if(!ok&&q.word){st.miss[q.word]=(st.miss[q.word]||0)+1;save()}
      if(mock){stop();next();return}
      btns.forEach(x=>{x.disabled=true;const xa=q.type==='tf'?x.dataset.a==='1':+x.dataset.a;if(xa===q.answer)x.classList.add('ok');else if(x===b)x.classList.add('ng')});
      document.getElementById('fb').innerHTML=`<div class="fb"><div class="res" style="color:${ok?'var(--green)':'var(--red)'}">${ok?'🎉 せいかい！':'😢 ざんねん…'}</div>
        <div class="py">${q.ex.py}</div><div class="hz">${esc(q.ex.hz)}</div><div class="jp">${esc(q.ex.jp)}</div>
        <div class="row"><button id="again">🔊 もういちど</button><button id="nx" style="background:var(--red);color:#fff;border-color:var(--red2)">つぎへ →</button></div></div>`;
      document.getElementById('again').onclick=()=>speak(q.audio||[q.ex.hz.replace(/[AB]: /g,'')],1);
      document.getElementById('nx').onclick=()=>{stop();next()};
      document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'end'});
    });
  };
  const next=()=>{i++;if(i<qs.length)show();else mock?mockResult(qs,res):pracResult(qs,res,pid)};
  show();
}
function pracResult(qs,res,pid){
  const c=res.filter(Boolean).length;

  <button class="btn main" id="re">もういちど</button><button class="btn" id="mn">ほかの れんしゅう</button><button class="btn" id="hm">ホームへ</button>`;

}

  読み上げの速さ：<select id="rt">${[[0.6,'ゆっくり'],[0.8,'ややゆっくり（標準）'],[1,'ふつう（本番に近い）']].map(([v,l])=>`<option value="${v}" ${+st.rate===v?'selected':''}>${l}</option>`).join('')}</select><br><br>
  <button class="pill" id="vt">🔊 音声テスト（你好）</button>
  <div style="font-size:12px;color:var(--mute);margin-top:6px">音声は端末内蔵の中国語読み上げを使用（現在：${voice?esc(voice.name):'未検出'}）。音が出ない場合は、消音スイッチ・音量と、iPhoneの「設定＞アクセシビリティ＞読み上げコンテンツ＞声」で中国語の声が入っているかをご確認ください。</div></div>
  <div class="box"><h3>もぎテストの記録</h3>${st.mocks.length?st.mocks.slice().reverse().map(m=>`${m.d}：${m.l+m.r}点（聴${m.l}／読${m.r}）${m.l+m.r>=120?' ✅':''}`).join('<br>'):'まだありません'}</div>
  ${weak.length?`<div class="box"><h3>まちがいの多い単語</h3>${weak.slice(0,15).map(w=>`${esc(w[0])}（${esc(w[1])}／${esc(w[2])}）×${st.miss[w[0]]}`).join('<br>')}</div>`:''}
  <div class="box"><h3>80語一覧</h3><table><tr><th>漢字</th><th>ピンイン</th><th>意味</th></tr>${W.map(w=>`<tr><td>${esc(w[0])}</td><td>${esc(w[1])}</td><td>${esc(w[2])}</td></tr>`).join('')}</table></div>
  <div class="box"><h3>注意</h3>問題は公式大綱の語彙・文法に沿って作成したオリジナルで、公式の過去問ではありません。得点換算は1問あたり均等配点とした目安です。本番前に公式サンプル問題も一度解いておくことをおすすめします。</div>
  <button class="btn" id="rs" style="color:var(--red)">記録をすべてリセット</button>`;
  onBack(home);
  document.getElementById('ex').onchange=e=>{st.exam=e.target.value;save()};
  document.getElementById('rt').onchange=e=>{st.rate=+e.target.value;save()};
  document.getElementById('vt').onclick=()=>speak(['你好'],1);
  document.getElementById('rs').onclick=()=>{if(confirm('記録をすべて消しますか？')){const ex=st.exam,rt=st.rate;st={exam:ex,stars:0,best:{},miss:{},known:{},rate:rt,mocks:[]};save();home()}};
}
home();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
